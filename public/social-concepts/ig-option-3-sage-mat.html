<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #2E5A44; color: #1C2621; font-family: 'DM Sans', sans-serif;

  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }

    width: 100%; height: 760px; border-radius: 32px; overflow: hidden;

  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
  .details {
    margin-top: 28px; display: flex; justify-content: space-between; align-items: flex-end; flex: 1;
  }
  h1 { font-family: 'Playfair Display', serif; font-size: 76px; line-height: 1.02; color: #1C2621; }
  .sub { font-size: 24px; color: #5C6B63; font-weight: 600; margin-top: 10px; max-width: 650px; }
  .right { text-align: right; }
  .price { font-family: 'Playfair Display', serif; font-size: 54px; font-weight: 700; color: #D46A4E; }
  .text-cta { font-size: 20px; font-weight: 800; color: #2E5A44; margin-top: 6px; }

      </div>
