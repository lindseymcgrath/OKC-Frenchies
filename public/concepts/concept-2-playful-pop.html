<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 2: Playful Pop & Tactile Sticker Cards — OKC Frenchies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EE;
    --ink: #1B1917;
    --yellow: #FFE156;
    --pink: #FF85A1;
    --mint: #7CE5B7;
    --sky: #8AC6FD;
    --lilac: #D5B8FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(#E3DAC9 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: 'Outfit', sans-serif;
  }
  /* Marquee Banner */
  .ticker {
    background: var(--yellow);
    border-bottom: 3px solid var(--ink);
    padding: 10px 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  nav {
    max-width: 1340px;
    margin: 18px auto 0;
    padding: 0 24px;
  }
  .nav-box {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 5px 5px 0px var(--ink);
  }
  .logo {
    font-family: 'Fredoka', sans-serif;
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo span {
    background: var(--pink);
    border: 2px solid var(--ink);
    padding: 2px 10px;
    border-radius: 99px;
    font-size: 13px;
    color: #fff;
  }
  .nav-pills {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .nav-pill {
    padding: 9px 18px;
    border-radius: 99px;
    border: 2px solid transparent;
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    font-size: 15px;
  }
  .nav-pill.active, .nav-pill:hover {
    background: var(--mint);
    border-color: var(--ink);
    box-shadow: 3px 3px 0px var(--ink);
  }
  .nav-cta {
    background: var(--pink);
    color: #fff;
    border: 2px solid var(--ink);
    padding: 10px 20px;
    border-radius: 99px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 3px 3px 0px var(--ink);
  }

  /* Hero */
  .main-wrap {
    max-width: 1340px;
    margin: 26px auto 70px;
    padding: 0 24px;
  }
  .hero-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .hero-title-block h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(38px, 4.5vw, 60px);
    line-height: 1.02;
  }
  .sticker-word {
    display: inline-block;
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 2px 14px;
    transform: rotate(-2deg);
    box-shadow: 4px 4px 0px var(--ink);
  }
  .filter-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pop-btn {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 11px 20px;
    font-family: 'Fredoka', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--ink);
    transition: all 0.15s;
  }
  .pop-btn:hover, .pop-btn.active {
    background: var(--sky);
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px var(--ink);
  }

  /* Trading Card Grid Right Away */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .trading-card {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 26px;
    padding: 14px;
    box-shadow: 6px 6px 0px var(--ink);
    transition: transform 0.18s, box-shadow 0.18s;
    display: flex;
    flex-direction: column;
  }
  .trading-card:hover {
    transform: translate(-4px, -4px);
    box-shadow: 10px 10px 0px var(--ink);
  }
  .card-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .breed-sticker {
    background: var(--lilac);
    border: 2px solid var(--ink);
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .status-dot {
    background: var(--mint);
    border: 2px solid var(--ink);
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 800;
  }
  .status-dot.pending { background: var(--yellow); }
  .photo-frame {
    position: relative;
    border: 3px solid var(--ink);
    border-radius: 18px;
    overflow: hidden;
    aspect-ratio: 1/1.02;
    background: #eee;
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .thumb-strip {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.95);
    border: 2px solid var(--ink);
    padding: 4px 8px;
    border-radius: 99px;
  }
  .thumb-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: #fff;
    font-weight: 800;
    font-size: 11px;
    cursor: pointer;
  }
  .thumb-btn.active {
    background: var(--yellow);
  }
  .name-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .name-row h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 26px;
  }
  .price-tag {
    background: var(--yellow);
    border: 2px solid var(--ink);
    padding: 4px 10px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 15px;
  }
  .vibe-pill {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
  }
  .dna-box {
    margin-top: 8px;
    background: #FAF6EE;
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
  }
  .adopt-btn {
    margin-top: 12px;
    width: 100%;
    background: var(--pink);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 11px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 3px 3px 0px var(--ink);
  }
  .adopt-btn:hover { background: #ff6a8d; }
</style>
</head>
<body>
  <div class="ticker">
    🐾 NO DARK AI ROBOTS HERE — JUST CHUNKY WRINKLES, REAL PHOTOS & HAPPY PUPPIES IN OKLAHOMA CITY! • 7 BABIES AVAILABLE NOW! 🐾
  </div>
  <nav>
    <div class="nav-box">
      <div class="logo">🐶 OKC Frenchies <span>LIVE NURSERY</span></div>
      <div class="nav-pills">
        <a href="#" class="nav-pill active">Available Pups (7)</a>
        <a href="#" class="nav-pill">Stud Boys</a>
        <a href="#" class="nav-pill">DNA Toy Box</a>
        <a href="#" class="nav-cta">Text Us about a Puppy 💬</a>
      </div>
    </div>
  </nav>

  <main class="main-wrap">
    <div class="hero-header">
      <div class="hero-title-block">
        <h1>Pick Your <span class="sticker-word">Squishy</span> Best Friend!</h1>
      </div>
      <div class="filter-bar">
        <button class="pop-btn active" onclick="render('all', this)">✨ Show All (8)</button>
        <button class="pop-btn" onclick="render('French Bulldog', this)">🥐 Frenchies (4)</button>
        <button class="pop-btn" onclick="render('Mini English Bulldog', this)">🧸 Mini English (4)</button>
      </div>
    </div>

    <div class="card-grid" id="cards"></div>
  </main>

  <script>
    const puppies = [{"name":"Alice","nickname":"Little Twin","status":"Available","breed":"French Bulldog","gender":"Female","age":"5 Months","dna":"Lilac & Tan Big Rope • Carries Pink & Fluffy","vibe":"Super Tiny Pocket Princess","price":"$4,000","badgeColor":"#FADADD","images":["../images/puppies/alice-1.webp","../images/puppies/alice-2.webp"]},{"name":"Arya","nickname":"Big Twin","status":"Available","breed":"French Bulldog","gender":"Female","age":"5 Months","dna":"Lilac & Tan Big Rope • Carries Pink & Fluffy","vibe":"Compact Wrinkle Queen","price":"$4,000","badgeColor":"#E2D4F0","images":["../images/puppies/arya-1.webp","../images/puppies/arya-2.webp"]},{"name":"Brew","nickname":"Merle Chunk","status":"Available","breed":"Mini English Bulldog","gender":"Male","age":"Newborn Litter","dna":"Lilac Tri Merle","vibe":"Sleepy Sweetheart","price":"$4,500","badgeColor":"#D9EAD3","images":["../images/puppies/brew-1.webp","../images/puppies/brew-2.webp","../images/puppies/brew-3.webp"]},{"name":"Bean","nickname":"Teddy Bear","status":"Available","breed":"Mini English Bulldog","gender":"Male","age":"Newborn Litter","dna":"Lilac Tri","vibe":"Cuddle Bug","price":"$4,000","badgeColor":"#FFF2CC","images":["../images/puppies/bean-1.webp","../images/puppies/bean-2.webp","../images/puppies/bean-3.webp"]},{"name":"Biscotti","nickname":"Sweet Cookie","status":"Available","breed":"Mini English Bulldog","gender":"Female","age":"Newborn Litter","dna":"Chocolate Tri","vibe":"Playful & Curious","price":"$5,000","badgeColor":"#FCE5CD","images":["../images/puppies/biscotti.webp"]},{"name":"Alex","nickname":"Fluffy Boy","status":"Available","breed":"French Bulldog","gender":"Male","age":"Ready Now","dna":"Fluffy Lilac & Tan","vibe":"Floofy Gentleman","price":"$3,000","badgeColor":"#D0E0E3","images":["../images/puppies/alex.webp"]},{"name":"Shuffin","nickname":"Rare Floodle","status":"Available","breed":"French Bulldog","gender":"Female","age":"Ready Now","dna":"Isabella & Tan Sable Floodle • Carries Pink","vibe":"One-of-a-Kind Teddy","price":"$20,000","badgeColor":"#FADADD","images":["../images/puppies/shuffin.webp"]},{"name":"Brulee","nickname":"Cream Puff","status":"Pending","breed":"Mini English Bulldog","gender":"Female","age":"Newborn Litter","dna":"Lilac Tri","vibe":"Reserved / Pending","price":"$5,000","badgeColor":"#E6E6E6","images":["../images/puppies/brulee.webp"]}];
    function render(filter = 'all', btn) {
      if (btn) {
        document.querySelectorAll('.pop-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      const list = filter === 'all' ? puppies : puppies.filter(p => p.breed === filter);
      document.getElementById('cards').innerHTML = list.map((p, idx) => `
        <div class="trading-card">
          <div class="card-top-bar">
            <span class="breed-sticker">${p.breed === 'French Bulldog' ? '🥐 Frenchie' : '🧸 Mini English'}</span>
            <span class="status-dot ${p.status === 'Pending' ? 'pending' : ''}">${p.status === 'Available' ? '● Ready!' : '⏳ Pending'}</span>
          </div>
          <div class="photo-frame">
            <img id="pop-img-${idx}" src="${p.images[0]}" alt="${p.name}" />
            ${p.images.length > 1 ? `
              <div class="thumb-strip">
                ${p.images.map((u, i) => `
                  <button class="thumb-btn ${i===0?'active':''}" onclick="swap(${idx}, '${u}', this)">${i+1}</button>
                `).join('')}
              </div>
            ` : ''}
          </div>
          <div class="name-row">
            <h2>${p.name}</h2>
            <span class="price-tag">${p.price}</span>
          </div>
          <div class="vibe-pill">💬 "${p.vibe}" • ${p.gender}</div>
          <div class="dna-box">🧬 ${p.dna}</div>
          <button class="adopt-btn">Ask About ${p.name} →</button>
        </div>
      `).join('');
    }
    function swap(idx, url, btn) {
      document.getElementById('pop-img-' + idx).src = url;
      btn.parentElement.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    render();
  </script>
</body>
</html>
